<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Drkr Safari beta check</title><style>
body{font:16px system-ui;margin:40px;background:#fff;color:#222;max-width:860px}.panel{padding:20px;margin:20px 0;background:#f2f3f5;border:1px solid #ccc;border-radius:14px}.gradient{background:linear-gradient(120deg,#fff 20%,#ddd 80%)}#pseudo::before{content:'Generated label';background:white;color:black;padding:5px}#masked{display:inline-block;width:22px;height:22px;background:black;mask-image:linear-gradient(black,black);-webkit-mask-image:linear-gradient(black,black)}input,select,textarea,button{font:inherit;padding:9px;margin:8px;background:white;color:#222;border:1px solid #bbb;border-radius:6px}#results{white-space:pre-wrap;line-height:1.6}a{color:#0645ad}
</style></head><body><h1>Drkr Safari beta check</h1><p>Local test content only. No network calls, login, or user data.</p><div id="gradient" class="panel gradient">A gradient should keep its shape and become dark.</div><div id="pseudo" class="panel"></div><div class="panel"><span id="masked"></span> Mask icon should remain visible.</div><div id="shadow"></div><div id="important" class="panel" style="background:white!important;color:#111!important">This author-important panel stays original and readable.</div><div class="panel"><label>Example input <input id="input" value="Test value"></label><label>Pick a value <select><option>One</option><option>Two</option></select></label><label>Notes <textarea>Test note</textarea></label><button id="add">Add a card</button><a href="#results">View results</a></div><h2>Automated page checks</h2><pre id="results" role="status">Waiting for Drkr…</pre><script>
const shadow = document.getElementById('shadow').attachShadow({mode:'open'});
shadow.innerHTML='<style>p{background:white;color:black;padding:20px;border:1px solid #ccc;border-radius:14px}</style><p>Open shadow-root content</p>';
document.getElementById('add').onclick=()=>{const el=document.createElement('div');el.className='panel';el.textContent='Dynamically added card';document.body.append(el)};
const started=performance.now();
const poll=setInterval(()=>{
 if (!document.documentElement.hasAttribute('data-drkr-ready')) {if(performance.now()-started>10000){clearInterval(poll);document.getElementById('results').textContent='Drkr not detected. Enable access to this test page and reload.'}return}
 clearInterval(poll);
 setTimeout(()=>{
  const checks=[
   ['Body is dark',getComputedStyle(document.body).backgroundColor!=='rgb(255, 255, 255)'],
   ['Gradient retained',getComputedStyle(document.getElementById('gradient')).backgroundImage.includes('linear-gradient')],
   ['Generated content themed',getComputedStyle(document.getElementById('pseudo'),'::before').backgroundColor!=='rgb(255, 255, 255)'],
   ['Open shadow root themed',getComputedStyle(shadow.querySelector('p')).backgroundColor!=='rgb(255, 255, 255)'],
   ['Author-important surface preserved',getComputedStyle(document.getElementById('important')).backgroundColor==='rgb(255, 255, 255)'],
   ['Form value preserved',document.getElementById('input').value==='Test value'],
   ['Mask icon recolored',getComputedStyle(document.getElementById('masked')).backgroundColor!=='rgb(0, 0, 0)']
  ];
  document.getElementById('results').textContent=checks.map(([name,pass])=>(pass?'PASS':'FAIL')+' — '+name).join('\n')+'\n'+checks.filter(c=>c[1]).length+'/'+checks.length+' checks passed.\n'+navigator.userAgent;
 },250)
},50);
</script></body></html>
